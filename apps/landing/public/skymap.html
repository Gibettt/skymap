<!DOCTYPE html>
<html lang="en">

    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Stellarium Web Online Star Map</title>
    <meta name="description" content="Stellarium Web is a planetarium running in your web browser. It shows a realistic star map, just like what you see with the naked eye, binoculars or a telescope.">
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style type="text/css">
    #nightmode {
      background: #ff2200;
      pointer-events: none;
      height: 100vh;
      width: 100vw;
      position: absolute;
      z-index: 1000;
      mix-blend-mode: multiply;
      visibility: hidden;
    }
    /* Hide location and time buttons on mobile devices (iOS & Android) and mobile viewports */
    @media (max-width: 900px), (pointer: coarse) {
      .tbtcontainer,
      .tmenubt {
        display: none !important;
      }
    }
    html.is-mobile .tbtcontainer,
    body.is-mobile .tbtcontainer,
    html.is-mobile .tmenubt,
    body.is-mobile .tmenubt {
      display: none !important;
    }
    </style>
    <script>
    if (/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || window.innerWidth <= 900) {
      document.documentElement.classList.add('is-mobile');
    }
    </script>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function(registrations) {
    for (let r of registrations) {
